name: onnx_runtime_dart
description: A pure-Dart ONNX inference runtime for transformer, vision, audio, and generative models, with an optional native ONNX Runtime backend on native platforms. Web and WebAssembly stay pure Dart.
version: 0.11.0
repository: https://github.com/CrispStrobe/onnx_runtime_dart
topics:
  - onnx
  - inference
  - machine-learning
  - transformer

environment:
  sdk: ^3.13.5

dependencies:
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  ffi: ^2.1.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  covfuzz: ^0.1.0
